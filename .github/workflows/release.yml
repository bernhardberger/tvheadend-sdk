name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'bernhardberger/tvheadend-sdk' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: central
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Set up Temurin 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify release tool self-tests
        run: |
          ./tools/check-staged-publication --self-test
          ./tools/publish-central-release --self-test
      - name: Build and stage publication
        run: ./gradlew --no-daemon clean build check stageLocalPublication
      - name: Verify staged SDK publication
        run: ./tools/check-staged-publication
      - name: Verify staged consumer contract
        run: ./gradlew --no-daemon -p consumer-contract clean test verifyConsumerDependencyGraph
      - name: Check release setup
        run: ./tools/publish-central-release --check-setup
      - name: Authorize one Central upload or recovery
        id: central-authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/publish-central-release --authorize-central-upload
      - name: Sign, publish, and verify Central
        if: steps.central-authorization.outputs.decision == 'upload'
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          CENTRAL_PORTAL_TOKEN: ${{ secrets.CENTRAL_PORTAL_TOKEN }}
        run: ./tools/publish-central-release --publish
      - name: Recover and verify Central
        if: steps.central-authorization.outputs.decision == 'recover'
        run: ./tools/publish-central-release --publish
      - name: Transfer verified release outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-release-${{ github.run_id }}
          path: |
            build/local-maven
            build/release
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  github-release:
    needs: release
    if: needs.release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out exact tag without release secrets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download verified release outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release-${{ github.run_id }}
          path: build
      - name: Finalize GitHub prerelease from verified outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/publish-central-release --finalize-github-release
