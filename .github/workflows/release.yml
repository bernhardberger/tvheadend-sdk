name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'bernhardberger/tvheadend-sdk' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: central
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Locate successful first-attempt push CI
        id: ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/publish-central-release --select-ci-run >> "$GITHUB_OUTPUT"
      - name: Download exact CI staging
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: staged-publication-${{ steps.ci.outputs.ci_run_id }}
          path: build
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.ci.outputs.ci_run_id }}
      - name: Validate exact CI staging locally
        env:
          CI_RUN_ID: ${{ steps.ci.outputs.ci_run_id }}
        run: |
          ./tools/check-staged-publication --compare-manifest build/staged-publication.json
          ./tools/publish-central-release --verify-ci-staging
      - name: Prepare signed release bundle
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./tools/publish-central-release --prepare
      - name: Retain signed release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ github.run_id }}
          path: build/release
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload once to Central
        env:
          CENTRAL_PORTAL_TOKEN: ${{ secrets.CENTRAL_PORTAL_TOKEN }}
        run: ./tools/publish-central-release --upload
