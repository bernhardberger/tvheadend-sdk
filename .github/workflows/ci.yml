name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PRs supersede only their own PR; every main run retains staging provenance.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Set up Temurin 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore Gradle dependencies
        id: dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: sdk-dependencies-v1-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', 'gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: sdk-dependencies-v1-${{ runner.os }}-
      - name: Install pinned Android SDK packages
        run: '"$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Verify release tool self-tests
        run: |
          ./tools/check-staged-publication --self-test
          ./tools/publish-central-release --self-test
      - name: Build, check, and stage all SDK modules
        run: ./gradlew --no-daemon clean build check stageLocalPublication
      - name: Verify staged SDK publication
        run: ./tools/check-staged-publication --write-manifest build/staged-publication.json
      - name: Verify staged consumer contract
        run: ./gradlew --no-daemon -p consumer-contract clean test verifyConsumerDependencyGraph
      - name: Check release setup
        run: ./tools/publish-central-release --check-setup
      - name: Record successful push staging provenance
        if: github.event_name == 'push' && github.run_attempt == 1
        run: ./tools/publish-central-release --write-ci-provenance
      - name: Retain successful push staging
        if: github.event_name == 'push' && github.run_attempt == 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staged-publication-${{ github.run_id }}
          path: |
            build/local-maven
            build/staged-publication.json
            build/ci-staging-provenance.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Save trusted Gradle dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
